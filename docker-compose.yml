services:
  postgres:
    image: postgres:16
    container_name: coursematch_postgres
    restart: always
    environment:
      POSTGRES_DB: coursematch_db
      POSTGRES_USER: coursematch_user
      POSTGRES_PASSWORD: coursematch_password
    ports:
      - "5432:5432"
    volumes:
      - coursematch_postgres_data:/var/lib/postgresql/data

volumes:
  coursematch_postgres_data:
